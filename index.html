<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Life in Weeks">
  <title>Life in Weeks</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; }
    .dot-row { display: flex; flex-wrap: nowrap; align-items: center; }
    .year-row { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; width: 100%; }
    .year-cols { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    window.storage = {
      get: async (key) => {
        const value = localStorage.getItem(key);
        return value ? { key, value } : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return { key, value };
      }
    };

    function LifeInWeeks() {
      const [birthDate, setBirthDate] = useState('');
      const [lifeExpectancy, setLifeExpectancy] = useState('80');
      const [showVisualization, setShowVisualization] = useState(false);
      const [memories, setMemories] = useState({});
      const [selectedDate, setSelectedDate] = useState(null);
      const [memoryText, setMemoryText] = useState('');
      const [showMemoryModal, setShowMemoryModal] = useState(false);
      const [hoveredWeek, setHoveredWeek] = useState(null);
      const [clickedWeek, setClickedWeek] = useState(null);
      const [tooltipPosition, setTooltipPosition] = useState({ x: 0, y: 0 });
      const [userName, setUserName] = useState('');
      const [showNamePrompt, setShowNamePrompt] = useState(false);
      const [nameInput, setNameInput] = useState('');
      const [dotGap, setDotGap] = useState(12);
      const gridRef = useRef(null);

      useEffect(() => {
        const loadUserName = async () => {
          try {
            const result = await window.storage.get('life-weeks-user-name');
            if (result && result.value) setUserName(result.value);
            else setShowNamePrompt(true);
          } catch { setShowNamePrompt(true); }
        };
        loadUserName();
      }, []);

      useEffect(() => {
        if (showVisualization && birthDate) loadMemories();
      }, [showVisualization, birthDate]);

      useEffect(() => {
        const calculateGap = () => {
          if (gridRef.current) {
            const containerWidth = gridRef.current.offsetWidth;
            const labelWidth = 60; // label + gap
            const availableWidth = containerWidth - labelWidth;
            const dotSize = 12;
            const numDots = 26;
            const gap = (availableWidth - dotSize * numDots) / (numDots - 1);
            setDotGap(Math.max(4, Math.floor(gap)));
          }
        };
        if (showVisualization) {
          setTimeout(calculateGap, 50);
          window.addEventListener('resize', calculateGap);
          return () => window.removeEventListener('resize', calculateGap);
        }
      }, [showVisualization]);

      const loadMemories = async () => {
        try {
          const result = await window.storage.get(`life-weeks-memories-${birthDate}`);
          if (result && result.value) setMemories(JSON.parse(result.value));
        } catch { setMemories({}); }
      };

      const saveMemories = async (m) => {
        try { await window.storage.set(`life-weeks-memories-${birthDate}`, JSON.stringify(m)); }
        catch (e) { console.error(e); }
      };

      const handleSaveName = async () => {
        if (nameInput.trim()) {
          await window.storage.set('life-weeks-user-name', nameInput.trim());
          setUserName(nameInput.trim());
          setShowNamePrompt(false);
        }
      };

      const calculateStats = () => {
        if (!birthDate) return null;
        const [y, m, d] = birthDate.split('-').map(Number);
        const birth = new Date(y, m - 1, d);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const expectedYears = parseInt(lifeExpectancy);
        const currentYear = today.getFullYear();
        let ageInYears = currentYear - birth.getFullYear();
        const currentAnniversary = new Date(currentYear, birth.getMonth(), birth.getDate());
        if (today < currentAnniversary) ageInYears--;
        const yearStart = new Date(currentYear - (today < currentAnniversary ? 1 : 0), birth.getMonth(), birth.getDate());
        const daysSinceYearStart = Math.floor((today - yearStart) / 86400000);
        const weekInYear = Math.floor(daysSinceYearStart / 7);
        const ageDays = Math.floor((today - birth) / 86400000);
        const totalWeeksLived = Math.floor(ageDays / 7);
        const totalWeeks = expectedYears * 52;
        return {
          ageInYears, weekInYear, totalWeeksLived, totalWeeks,
          remainingWeeks: totalWeeks - totalWeeksLived,
          ageDays,
          percentageLived: ((totalWeeksLived / totalWeeks) * 100).toFixed(1),
          heartbeats: Math.floor(ageDays * 24 * 60 * 70),
          breaths: Math.floor(ageDays * 24 * 60 * 16),
          sleepHours: Math.floor(ageDays * 8),
          moonCycles: Math.floor(ageDays / 29.53),
          expectedYears, birth
        };
      };

      const stats = calculateStats();
      const fmt = (n) => new Intl.NumberFormat('en-US').format(n);

      const getWeekDates = (yi, wi) => {
        if (!stats) return [];
        const yearStart = new Date(stats.birth.getFullYear() + yi, stats.birth.getMonth(), stats.birth.getDate());
        const weekStart = new Date(yearStart);
        weekStart.setDate(yearStart.getDate() + wi * 7);
        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(weekStart);
          d.setDate(weekStart.getDate() + i);
          return d;
        });
      };

      const getWeekDateRange = (yi, wi) => {
        const dates = getWeekDates(yi, wi);
        if (!dates.length) return '';
        const f = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        return `${f(dates[0])} - ${f(dates[6])}, ${dates[0].getFullYear()}`;
      };

      const formatDate = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      const dateKey = (d) => d.toISOString().split('T')[0];
      const weekHasMemory = (yi, wi) => getWeekDates(yi, wi).some(d => memories[dateKey(d)]);

      const handleSaveMemory = async () => {
        const m = { ...memories };
        if (memoryText.trim()) m[selectedDate] = memoryText.trim();
        else delete m[selectedDate];
        setMemories(m);
        await saveMemories(m);
        setShowMemoryModal(false);
        setSelectedDate(null);
        setMemoryText('');
      };

      const Dot = ({ yi, wi, isPast, isCurrent, hasMem }) => {
        const size = hasMem ? 14 : isCurrent ? 14 : 12;
        const bg = isCurrent ? '#111827' : isPast ? (hasMem ? '#60a5fa' : '#9ca3af') : '#e5e7eb';
        const border = isCurrent ? '#374151' : isPast ? (hasMem ? '#2563eb' : '#4b5563') : '#9ca3af';
        return (
          <div
            onMouseEnter={(e) => {
              const r = e.target.getBoundingClientRect();
              setTooltipPosition({ x: r.left + r.width / 2, y: r.top - 60 });
              setHoveredWeek({ yi, wi });
            }}
            onMouseLeave={() => setHoveredWeek(null)}
            onClick={() => setClickedWeek({ yi, wi })}
            style={{
              width: size + 'px', height: size + 'px',
              borderRadius: '50%', backgroundColor: bg,
              border: '1px solid ' + border,
              cursor: 'pointer', flexShrink: 0, boxSizing: 'border-box'
            }}
          />
        );
      };

      if (showNamePrompt) return (
        <div className="min-h-screen bg-white flex items-center justify-center p-4">
          <div className="w-full max-w-sm">
            <h2 className="text-xl font-light text-gray-900 mb-2">Welcome</h2>
            <p className="text-sm text-gray-600 mb-8">What's your name? We'll use it to personalize your experience.</p>
            <input type="text" value={nameInput} onChange={(e) => setNameInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && handleSaveName()}
              placeholder="Your first name" autoFocus
              className="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-gray-900 text-gray-900 mb-4" />
            <button onClick={handleSaveName} className="w-full py-3 bg-gray-900 text-white text-sm font-light hover:bg-gray-800">
              Continue
            </button>
          </div>
        </div>
      );

      if (!showVisualization) return (
        <div className="min-h-screen bg-white flex items-center justify-center p-4">
          <div className="w-full max-w-md">
            {userName && <p className="text-sm text-gray-500 mb-6">Welcome back, {userName}</p>}
            <h1 className="text-2xl font-light text-gray-900 mb-2">Life in weeks</h1>
            <p className="text-sm text-gray-600 mb-12">A simple visualization to reflect on the passage of time</p>
            <div className="space-y-8">
              <div>
                <label className="block text-sm text-gray-700 mb-2">When were you born?</label>
                <input type="date" value={birthDate} onChange={(e) => setBirthDate(e.target.value)}
                  max={new Date().toISOString().split('T')[0]}
                  className="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-gray-900 text-gray-900" />
              </div>
              <div>
                <label className="block text-sm text-gray-700 mb-2">Expected life span (years)</label>
                <input type="number" value={lifeExpectancy} onChange={(e) => setLifeExpectancy(e.target.value)}
                  min="1" max="120"
                  className="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-gray-900 text-gray-900" />
              </div>
              <button onClick={() => birthDate && lifeExpectancy && setShowVisualization(true)}
                className="w-full py-3 bg-gray-900 text-white text-sm font-light hover:bg-gray-800">
                Visualize
              </button>
            </div>
          </div>
        </div>
      );

      // Build grid
      const grid = [];
      for (let yi = 0; yi < stats.expectedYears; yi++) {
        const isCurrYear = yi === stats.ageInYears;
        const isPastYear = yi < stats.ageInYears;
        const row1 = [], row2 = [];
        for (let wi = 0; wi < 52; wi++) {
          const dot = <Dot key={wi} yi={yi} wi={wi}
            isPast={isPastYear || (isCurrYear && wi < stats.weekInYear)}
            isCurrent={isCurrYear && wi === stats.weekInYear}
            hasMem={weekHasMemory(yi, wi)} />;
          if (wi < 26) row1.push(dot); else row2.push(dot);
        }
        const ys = stats.birth.getFullYear() + yi;
        grid.push(
          <div key={yi} style={{ paddingBottom: '8px', marginBottom: '8px', borderBottom: '1px solid #e5e7eb' }}>
            <div className="year-row">
              <div style={{ width: '52px', fontSize: '9px', color: '#374151', textAlign: 'right', flexShrink: 0 }}>
                {ys}–{ys + 1}
              </div>
              <div className="year-cols">
                <div className="dot-row" style={{ gap: dotGap + 'px' }}>{row1}</div>
                <div className="dot-row" style={{ gap: dotGap + 'px' }}>{row2}</div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-white">
          <div className="max-w-4xl mx-auto px-4 py-8 md:py-16">
            <div className="mb-12">
              {userName && <p className="text-sm text-gray-500 mb-2">Welcome back, {userName}. This is your life in weeks.</p>}
              <h1 className="text-2xl font-light text-gray-900 mb-4">Your life in weeks</h1>
              <p className="text-sm text-gray-600">
                Each pair of rows is one year, starting on your birth date. Each dot is one week.
                Hover to see dates, click to journal a memory.
              </p>
            </div>

            <div ref={gridRef} style={{ display: 'flex', flexDirection: 'column', gap: '6px', margin: '3rem 0' }}>
              {grid}
            </div>

            <div className="text-xs text-gray-400 text-center mb-16">
              Year {stats.ageInYears + 1} of {stats.expectedYears} • Week {stats.weekInYear + 1} of 52
            </div>

            {hoveredWeek && (
              <div className="fixed bg-gray-900 text-white text-xs rounded px-2 py-1 pointer-events-none whitespace-nowrap"
                style={{ left: tooltipPosition.x, top: tooltipPosition.y, transform: 'translateX(-50%)', zIndex: 9999 }}>
                {getWeekDateRange(hoveredWeek.yi, hoveredWeek.wi)}
              </div>
            )}

            {clickedWeek && (
              <div className="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center p-4 z-50"
                onClick={() => setClickedWeek(null)}>
                <div className="bg-white rounded-lg shadow-xl border border-gray-200 p-4" onClick={(e) => e.stopPropagation()}>
                  <p className="text-xs text-gray-500 mb-3">Select a date to journal</p>
                  <div className="flex flex-col gap-1">
                    {getWeekDates(clickedWeek.yi, clickedWeek.wi).map((date, i) => {
                      const dk = dateKey(date);
                      const hasMem = memories[dk];
                      return (
                        <button key={i} onClick={() => {
                          setSelectedDate(dk);
                          setMemoryText(memories[dk] || '');
                          setShowMemoryModal(true);
                          setClickedWeek(null);
                        }} className={`text-left px-3 py-1.5 text-xs rounded transition-colors whitespace-nowrap flex items-center justify-between gap-4 ${hasMem ? 'bg-blue-50 text-blue-900 hover:bg-blue-100' : 'hover:bg-gray-100 text-gray-700'}`}>
                          <span>{formatDate(date)}</span>
                          {hasMem && <span className="text-blue-400">●</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {showMemoryModal && selectedDate && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-lg p-6 max-w-md w-full">
                  <h3 className="text-lg font-light text-gray-900 mb-1">Journal entry</h3>
                  <p className="text-sm text-gray-500 mb-4">{formatDate(new Date(selectedDate + 'T00:00:00'))}</p>
                  <textarea value={memoryText} onChange={(e) => setMemoryText(e.target.value)}
                    placeholder="What happened? What do you want to remember?"
                    className="w-full h-36 px-3 py-2 border border-gray-300 focus:outline-none focus:border-gray-900 text-gray-900 text-sm resize-none"
                    autoFocus />
                  <div className="flex gap-2 mt-4">
                    <button onClick={handleSaveMemory}
                      className="flex-1 py-2 bg-gray-900 text-white text-sm font-light hover:bg-gray-800">Save</button>
                    <button onClick={() => { setShowMemoryModal(false); setSelectedDate(null); setMemoryText(''); }}
                      className="flex-1 py-2 bg-gray-100 text-gray-700 text-sm font-light hover:bg-gray-200">Cancel</button>
                  </div>
                </div>
              </div>
            )}

            <div className="space-y-12">
              <div className="border-t border-gray-200 pt-12">
                <h2 className="text-lg font-light text-gray-900 mb-8">Time lived</h2>
                <div className="grid grid-cols-2 gap-8 text-sm">
                  {[[fmt(stats.totalWeeksLived), 'weeks lived'], [stats.percentageLived + '%', 'of expected life'],
                    [fmt(stats.ageDays), 'days of experience'], [fmt(stats.remainingWeeks), 'weeks ahead']
                  ].map(([val, label]) => (
                    <div key={label}>
                      <div className="text-3xl font-light text-gray-900 mb-1">{val}</div>
                      <div className="text-gray-500">{label}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div className="border-t border-gray-200 pt-12">
                <h2 className="text-lg font-light text-gray-900 mb-8">Biological rhythms</h2>
                <div className="space-y-4 text-sm text-gray-700">
                  {[`Your heart has beaten approximately ${fmt(stats.heartbeats)} times`,
                    `You've taken around ${fmt(stats.breaths)} breaths`,
                    `You've slept approximately ${fmt(stats.sleepHours)} hours`,
                    `You've witnessed ${fmt(stats.moonCycles)} full moon cycles`
                  ].map(t => <p key={t}>{t}</p>)}
                </div>
              </div>
              <div className="border-t border-gray-200 pt-12">
                <h2 className="text-lg font-light text-gray-900 mb-8">Perspective</h2>
                <div className="space-y-4 text-sm text-gray-600 max-w-2xl">
                  <p>If you live to {stats.expectedYears}, you will have experienced approximately {fmt(stats.totalWeeks)} weeks. Each one a chance to learn, create, connect, and reflect.</p>
                  <p>The ancient Stoics believed in "memento mori" — remembering that our time is finite. Not to invoke fear, but to inspire presence and meaning in each moment.</p>
                  <p>What will you do with your remaining {fmt(stats.remainingWeeks)} weeks?</p>
                </div>
              </div>
            </div>

            <button onClick={() => setShowVisualization(false)}
              className="mt-16 text-sm text-gray-400 hover:text-gray-700 transition-colors">
              ← Start over
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.render(React.createElement(LifeInWeeks), document.getElementById('root'));
  </script>
</body>
</html>
