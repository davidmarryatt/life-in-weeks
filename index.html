<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Life in Weeks">
  <title>Life in Weeks</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    window.storage = {
      get: async (key) => {
        const value = localStorage.getItem(key);
        return value ? { key, value } : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return { key, value };
      }
    };

    function LifeInWeeks() {
      const [birthDate, setBirthDate] = useState('');
      const [lifeExpectancy, setLifeExpectancy] = useState('80');
      const [showVisualization, setShowVisualization] = useState(false);
      const [memories, setMemories] = useState({});
      const [selectedDate, setSelectedDate] = useState(null);
      const [memoryText, setMemoryText] = useState('');
      const [showMemoryModal, setShowMemoryModal] = useState(false);
      const [hoveredWeek, setHoveredWeek] = useState(null);
      const [clickedWeek, setClickedWeek] = useState(null);
      const [tooltipPosition, setTooltipPosition] = useState({ x: 0, y: 0 });
      const [userName, setUserName] = useState('');
      const [showNamePrompt, setShowNamePrompt] = useState(false);
      const [nameInput, setNameInput] = useState('');

      useEffect(() => {
        const loadUserName = async () => {
          try {
            const result = await window.storage.get('life-weeks-user-name');
            if (result && result.value) {
              setUserName(result.value);
            } else {
              setShowNamePrompt(true);
            }
          } catch (error) {
            setShowNamePrompt(true);
          }
        };
        loadUserName();
      }, []);

      useEffect(() => {
        if (showVisualization && birthDate) loadMemories();
      }, [showVisualization, birthDate]);

      const loadMemories = async () => {
        try {
          const result = await window.storage.get(`life-weeks-memories-${birthDate}`);
          if (result && result.value) setMemories(JSON.parse(result.value));
        } catch { setMemories({}); }
      };

      const saveMemories = async (m) => {
        try {
          await window.storage.set(`life-weeks-memories-${birthDate}`, JSON.stringify(m));
        } catch (e) { console.error(e); }
      };

      const handleSaveName = async () => {
        if (nameInput.trim()) {
          await window.storage.set('life-weeks-user-name', nameInput.trim());
          setUserName(nameInput.trim());
          setShowNamePrompt(false);
        }
      };

      const calculateStats = () => {
        if (!birthDate) return null;
        const [y, m, d] = birthDate.split('-').map(Number);
        const birth = new Date(y, m - 1, d);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const expectedYears = parseInt(lifeExpectancy);
        const currentYear = today.getFullYear();
        let ageInYears = currentYear - birth.getFullYear();
        const currentAnniversary = new Date(currentYear, birth.getMonth(), birth.getDate());
        if (today < currentAnniversary) ageInYears--;
        const yearStart = new Date(currentYear - (today < currentAnniversary ? 1 : 0), birth.getMonth(), birth.getDate());
        const daysSinceYearStart = Math.floor((today - yearStart) / 86400000);
        const weekInYear = Math.floor(daysSinceYearStart / 7);
        const ageDays = Math.floor((today - birth) / 86400000);
        const totalWeeksLived = Math.floor(ageDays / 7);
        const totalWeeks = expectedYears * 52;
        return {
          ageInYears, weekInYear, totalWeeksLived, totalWeeks,
          remainingWeeks: totalWeeks - totalWeeksLived,
          ageDays,
          percentageLived: ((totalWeeksLived / totalWeeks) * 100).toFixed(1),
          heartbeats: Math.floor(ageDays * 24 * 60 * 70),
          breaths: Math.floor(ageDays * 24 * 60 * 16),
          sleepHours: Math.floor(ageDays * 8),
          moonCycles: Math.floor(ageDays / 29.53),
          expectedYears, birth
        };
      };

      const stats = calculateStats();
      const fmt = (n) => new Intl.NumberFormat('en-US').format(n);

      const getWeekDates = (yi, wi) => {
        if (!stats) return [];
        const yearStart = new Date(stats.birth.getFullYear() + yi, stats.birth.getMonth(), stats.birth.getDate());
        const weekStart = new Date(yearStart);
        weekStart.setDate(yearStart.getDate() + wi * 7);
        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(weekStart);
          d.setDate(weekStart.getDate() + i);
          return d;
        });
      };

      const getWeekDateRange = (yi, wi) => {
        const dates = getWeekDates(yi, wi);
        if (!dates.length) return '';
        const f = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        return `${f(dates[0])} - ${f(dates[6])}, ${dates[0].getFullYear()}`;
      };

      const formatDate = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      const dateKey = (d) => d.toISOString().split('T')[0];
      const weekHasMemory = (yi, wi) => getWeekDates(yi, wi).some(d => memories[dateKey(d)]);

      const handleSaveMemory = async () => {
        const m = { ...memories };
        if (memoryText.trim()) m[selectedDate] = memoryText.trim();
        else delete m[selectedDate];
        setMemories(m);
        await saveMemories(m);
        setShowMemoryModal(false);
        setSelectedDate(null);
        setMemoryText('');
      };

      const WeekDot = ({ yi, wi, isPast, isCurrent, hasMem }) => {
        const onEnter = (e) => {
          const r = e.target.getBoundingClientRect();
          setTooltipPosition({ x: r.left + r.width / 2, y: r.top - 60 });
          setHoveredWeek({ yi, wi });
        };
        return React.createElement('div', {
          onMouseEnter: onEnter,
          onMouseLeave: () => setHoveredWeek(null),
          onClick: () => setClickedWeek({ yi, wi }),
          className: `rounded-full transition-all duration-200 cursor-pointer border ${
            isCurrent ? 'w-2.5 h-2.5 bg-gray-900 border-gray-700 scale-150' :
            isPast ? hasMem ? 'w-3 h-3 bg-blue-400 border-blue-600' : 'w-2.5 h-2.5 bg-gray-400 border-gray-600' :
            'w-2.5 h-2.5 bg-gray-200 border-gray-400'
          } hover:scale-125`
        });
      };

      // Name prompt modal
      const NamePrompt = () => React.createElement('div', {
        className: 'fixed inset-0 bg-white flex items-center justify-center p-4 z-50'
      },
        React.createElement('div', { className: 'w-full max-w-sm' },
          React.createElement('h2', { className: 'text-xl font-light text-gray-900 mb-2' }, 'Welcome'),
          React.createElement('p', { className: 'text-sm text-gray-600 mb-8' }, "What's your name? We'll use it to personalize your experience."),
          React.createElement('input', {
            type: 'text',
            value: nameInput,
            onChange: (e) => setNameInput(e.target.value),
            onKeyDown: (e) => e.key === 'Enter' && handleSaveName(),
            placeholder: 'Your first name',
            autoFocus: true,
            className: 'w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-gray-900 transition-colors text-gray-900 mb-4'
          }),
          React.createElement('button', {
            onClick: handleSaveName,
            className: 'w-full py-3 bg-gray-900 text-white text-sm font-light hover:bg-gray-800 transition-colors'
          }, 'Continue')
        )
      );

      if (showNamePrompt) return React.createElement(NamePrompt);

      if (!showVisualization) return React.createElement('div', {
        className: 'min-h-screen bg-white flex items-center justify-center p-4'
      },
        React.createElement('div', { className: 'w-full max-w-md' },
          userName && React.createElement('p', { className: 'text-sm text-gray-500 mb-6' }, `Welcome back, ${userName}`),
          React.createElement('h1', { className: 'text-2xl font-light text-gray-900 mb-2' }, 'Life in weeks'),
          React.createElement('p', { className: 'text-sm text-gray-600 mb-12' }, 'A simple visualization to reflect on the passage of time'),
          React.createElement('div', { className: 'space-y-8' },
            React.createElement('div', null,
              React.createElement('label', { className: 'block text-sm text-gray-700 mb-2' }, 'When were you born?'),
              React.createElement('input', {
                type: 'date', value: birthDate,
                onChange: (e) => setBirthDate(e.target.value),
                max: new Date().toISOString().split('T')[0],
                className: 'w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-gray-900 text-gray-900'
              })
            ),
            React.createElement('div', null,
              React.createElement('label', { className: 'block text-sm text-gray-700 mb-2' }, 'Expected life span (years)'),
              React.createElement('input', {
                type: 'number', value: lifeExpectancy,
                onChange: (e) => setLifeExpectancy(e.target.value),
                min: '1', max: '120',
                className: 'w-full px-4 py-3 border border-gray-300 focus:outline-none focus:border-gray-900 text-gray-900'
              })
            ),
            React.createElement('button', {
              onClick: () => birthDate && lifeExpectancy && setShowVisualization(true),
              className: 'w-full py-3 bg-gray-900 text-white text-sm font-light hover:bg-gray-800 transition-colors'
            }, 'Visualize')
          )
        )
      );

      // Build grid
      const grid = [];
      for (let yi = 0; yi < stats.expectedYears; yi++) {
        const weeks = [];
        const isCurrYear = yi === stats.ageInYears;
        const isPastYear = yi < stats.ageInYears;
        for (let wi = 0; wi < 52; wi++) {
          weeks.push(React.createElement(WeekDot, {
            key: wi, yi, wi,
            isPast: isPastYear || (isCurrYear && wi < stats.weekInYear),
            isCurrent: isCurrYear && wi === stats.weekInYear,
            hasMem: weekHasMemory(yi, wi)
          }));
        }
        const ys = stats.birth.getFullYear() + yi;
        grid.push(React.createElement('div', { key: yi, className: 'flex items-center gap-3 justify-center' },
          React.createElement('div', { className: 'text-[10px] text-gray-700 font-light w-16 text-right shrink-0' }, `${ys}–${ys + 1}`),
          React.createElement('div', { className: 'flex gap-1.5 flex-wrap' }, weeks)
        ));
      }

      return React.createElement('div', { className: 'min-h-screen bg-white' },
        React.createElement('div', { className: 'max-w-4xl mx-auto px-4 py-8 md:py-16' },

          // Header
          React.createElement('div', { className: 'mb-12' },
            userName && React.createElement('p', { className: 'text-sm text-gray-500 mb-2' },
              `Welcome back, ${userName}. This is your life in weeks.`
            ),
            React.createElement('h1', { className: 'text-2xl font-light text-gray-900 mb-4' }, 'Your life in weeks'),
            React.createElement('p', { className: 'text-sm text-gray-600 max-w-xl' },
              'Each row is one year, starting on your birth date. Hover a dot to see the week. Click to journal a memory.'
            )
          ),

          // Grid
          React.createElement('div', { className: 'flex flex-col gap-2 my-12' }, grid),
          React.createElement('div', { className: 'text-xs text-gray-400 text-center mb-16' },
            `Year ${stats.ageInYears + 1} of ${stats.expectedYears} • Week ${stats.weekInYear + 1} of 52`
          ),

          // Hover tooltip
          hoveredWeek && React.createElement('div', {
            className: 'fixed bg-gray-900 text-white text-xs rounded px-2 py-1 pointer-events-none whitespace-nowrap',
            style: { left: tooltipPosition.x, top: tooltipPosition.y, transform: 'translateX(-50%)', zIndex: 9999 }
          }, getWeekDateRange(hoveredWeek.yi, hoveredWeek.wi)),

          // Date picker modal
          clickedWeek && React.createElement('div', {
            className: 'fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center p-4 z-50',
            onClick: () => setClickedWeek(null)
          },
            React.createElement('div', {
              className: 'bg-white rounded-lg shadow-xl border border-gray-200 p-4',
              onClick: (e) => e.stopPropagation()
            },
              React.createElement('p', { className: 'text-xs text-gray-500 mb-3' }, 'Select a date to journal'),
              React.createElement('div', { className: 'flex flex-col gap-1' },
                getWeekDates(clickedWeek.yi, clickedWeek.wi).map((date, i) => {
                  const dk = dateKey(date);
                  const hasMem = memories[dk];
                  return React.createElement('button', {
                    key: i,
                    onClick: () => {
                      setSelectedDate(dk);
                      setMemoryText(memories[dk] || '');
                      setShowMemoryModal(true);
                      setClickedWeek(null);
                    },
                    className: `text-left px-3 py-1.5 text-xs rounded transition-colors whitespace-nowrap flex items-center justify-between gap-4 ${hasMem ? 'bg-blue-50 text-blue-900 hover:bg-blue-100' : 'hover:bg-gray-100 text-gray-700'}`
                  },
                    React.createElement('span', null, formatDate(date)),
                    hasMem && React.createElement('span', { className: 'text-blue-400 text-[8px]' }, '●')
                  );
                })
              )
            )
          ),

          // Memory modal
          showMemoryModal && selectedDate && React.createElement('div', {
            className: 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50'
          },
            React.createElement('div', { className: 'bg-white rounded-lg p-6 max-w-md w-full' },
              React.createElement('h3', { className: 'text-lg font-light text-gray-900 mb-1' }, 'Journal entry'),
              React.createElement('p', { className: 'text-sm text-gray-500 mb-4' }, formatDate(new Date(selectedDate + 'T00:00:00'))),
              React.createElement('textarea', {
                value: memoryText,
                onChange: (e) => setMemoryText(e.target.value),
                placeholder: 'What happened? What do you want to remember?',
                className: 'w-full h-36 px-3 py-2 border border-gray-300 focus:outline-none focus:border-gray-900 text-gray-900 text-sm resize-none',
                autoFocus: true
              }),
              React.createElement('div', { className: 'flex gap-2 mt-4' },
                React.createElement('button', {
                  onClick: handleSaveMemory,
                  className: 'flex-1 py-2 bg-gray-900 text-white text-sm font-light hover:bg-gray-800 transition-colors'
                }, 'Save'),
                React.createElement('button', {
                  onClick: () => { setShowMemoryModal(false); setSelectedDate(null); setMemoryText(''); },
                  className: 'flex-1 py-2 bg-gray-100 text-gray-700 text-sm font-light hover:bg-gray-200 transition-colors'
                }, 'Cancel')
              )
            )
          ),

          // Stats
          React.createElement('div', { className: 'space-y-12' },
            React.createElement('div', { className: 'border-t border-gray-200 pt-12' },
              React.createElement('h2', { className: 'text-lg font-light text-gray-900 mb-8' }, 'Time lived'),
              React.createElement('div', { className: 'grid grid-cols-2 gap-8 text-sm' },
                [
                  [fmt(stats.totalWeeksLived), 'weeks lived'],
                  [stats.percentageLived + '%', 'of expected life'],
                  [fmt(stats.ageDays), 'days of experience'],
                  [fmt(stats.remainingWeeks), 'weeks ahead']
                ].map(([val, label]) =>
                  React.createElement('div', { key: label },
                    React.createElement('div', { className: 'text-3xl font-light text-gray-900 mb-1' }, val),
                    React.createElement('div', { className: 'text-gray-500' }, label)
                  )
                )
              )
            ),
            React.createElement('div', { className: 'border-t border-gray-200 pt-12' },
              React.createElement('h2', { className: 'text-lg font-light text-gray-900 mb-8' }, 'Biological rhythms'),
              React.createElement('div', { className: 'space-y-4 text-sm text-gray-700' },
                [
                  `Your heart has beaten approximately ${fmt(stats.heartbeats)} times`,
                  `You've taken around ${fmt(stats.breaths)} breaths`,
                  `You've slept approximately ${fmt(stats.sleepHours)} hours`,
                  `You've witnessed ${fmt(stats.moonCycles)} full moon cycles`
                ].map(t => React.createElement('p', { key: t }, t))
              )
            ),
            React.createElement('div', { className: 'border-t border-gray-200 pt-12' },
              React.createElement('h2', { className: 'text-lg font-light text-gray-900 mb-8' }, 'Perspective'),
              React.createElement('div', { className: 'space-y-4 text-sm text-gray-600 max-w-2xl' },
                React.createElement('p', null, `If you live to ${stats.expectedYears}, you will have experienced approximately ${fmt(stats.totalWeeks)} weeks. Each one a chance to learn, create, connect, and reflect.`),
                React.createElement('p', null, 'The ancient Stoics believed in "memento mori" — remembering that our time is finite. Not to invoke fear, but to inspire presence and meaning in each moment.'),
                React.createElement('p', null, `What will you do with your remaining ${fmt(stats.remainingWeeks)} weeks?`)
              )
            )
          ),

          React.createElement('button', {
            onClick: () => setShowVisualization(false),
            className: 'mt-16 text-sm text-gray-400 hover:text-gray-700 transition-colors'
          }, '← Start over')
        )
      );
    }

    ReactDOM.render(React.createElement(LifeInWeeks), document.getElementById('root'));
  </script>
</body>
</html>
